<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#031b4e"/>
      <stop offset="100%" stop-color="#0a3d91"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>

  <!-- World network -->
  <g opacity="0.2" stroke="#5bbcff" fill="none">
    <circle cx="450" cy="400" r="280"/>
    <circle cx="450" cy="400" r="180"/>
  </g>

  <!-- Buildings -->
  <g>
    <rect x="170" y="500" width="180" height="420" fill="#174a9a"/>
    <rect x="330" y="360" width="240" height="560" fill="#1e5fc0"/>
    <rect x="550" y="520" width="170" height="400" fill="#174a9a"/>

    <!-- Windows -->
    <g fill="#d9eeff">
      <g>
        <rect x="360" y="390" width="180" height="18"/>
        <rect x="360" y="440" width="180" height="18"/>
        <rect x="360" y="490" width="180" height="18"/>
        <rect x="360" y="540" width="180" height="18"/>
        <rect x="360" y="590" width="180" height="18"/>
        <rect x="360" y="640" width="180" height="18"/>
        <rect x="360" y="690" width="180" height="18"/>
        <rect x="360" y="740" width="180" height="18"/>
      </g>
    </g>
  </g>

  <!-- Connection icons -->
  <g stroke="#6bc7ff" stroke-width="3" fill="none">
    <line x1="450" y1="320" x2="450" y2="180"/>
    <line x1="350" y1="300" x2="200" y2="200"/>
    <line x1="550" y1="300" x2="700" y2="200"/>
  </g>

  <g fill="#bfe6ff" stroke="#6bc7ff" stroke-width="3">
    <circle cx="450" cy="150" r="55"/>
    <circle cx="180" cy="180" r="55"/>
    <circle cx="720" cy="180" r="55"/>
  </g>

  <!-- Dashboard -->
  <rect x="80" y="900" width="320" height="190" rx="16" fill="#f4f8ff"/>
  <polyline points="120,1030 170,980 220,1000 280,940 350,960" fill="none" stroke="#3b82f6" stroke-width="6"/>
  <circle cx="180" cy="960" r="40" fill="#60a5fa"/>

  <!-- Tablet -->
  <rect x="460" y="980" width="220" height="90" rx="12" fill="#f4f8ff"/>
  <circle cx="570" cy="1025" r="28" fill="#60a5fa"/>

  <!-- Title -->
  <text x="450" y="1140" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="34"
        fill="#dbeafe">
    Plataforma Multiempresa
  </text>
</svg>