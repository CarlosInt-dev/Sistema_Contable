<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="main-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="company-alpha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="company-beta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="company-gamma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="line-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#CBD5E1" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <circle cx="200" cy="150" r="120" fill="#6366F1" opacity="0.15" filter="url(#blur-bg)"/>
  <circle cx="650" cy="450" r="150" fill="#38BDF8" opacity="0.2" filter="url(#blur-bg)"/>
  <circle cx="400" cy="300" r="180" fill="#A78BFA" opacity="0.1" filter="url(#blur-bg)"/>

  <g opacity="0.8">
    <path d="M 230 160 C 320 160, 280 260, 360 280" fill="none" stroke="url(#line-grad-1)" stroke-width="3" stroke-dasharray="8 4"/>
    <circle cx="290" cy="195" r="4" fill="#38BDF8" filter="url(#glow)"/>
    
    <path d="M 240 440 C 320 440, 280 340, 360 320" fill="none" stroke="url(#line-grad-2)" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="285" cy="400" r="4" fill="#34D399" filter="url(#glow)"/>

    <path d="M 570 300 C 480 300, 500 300, 440 300" fill="none" stroke="url(#company-gamma)" stroke-width="2.5" opacity="0.6"/>
    <path d="M 570 300 C 480 300, 500 300, 440 300" fill="none" stroke="#A78BFA" stroke-width="4" stroke-dasharray="12 20" opacity="0.9"/>
  </g>

  <g filter="url(#drop-shadow)">
    <rect x="340" y="180" width="220" height="260" rx="24" fill="url(#main-core)"/>
    <rect x="340" y="180" width="220" height="260" rx="24" fill="#FFFFFF" opacity="0.03"/>
    <path d="M 340 204 A 24 24 0 0 1 364 180 L 536 180 A 24 24 0 0 1 560 204 L 560 240 L 340 240 Z" fill="#FFFFFF" opacity="0.05"/>
    
    <circle cx="370" cy="205" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="385" cy="205" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="400" cy="205" r="5" fill="#10B981" opacity="0.8"/>
    
    <rect x="365" y="235" width="170" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="385" cy="251" r="6" fill="#0EA5E9"/>
    <rect x="400" y="247" width="80" height="8" rx="4" fill="#94A3B8"/>
    <path d="M 515 249 L 520 254 L 525 249" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <rect x="365" y="285" width="80" height="60" rx="8" fill="#1E293B" opacity="0.6"/>
    <path d="M 375 330 L 390 310 L 410 320 L 435 295" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="435" cy="295" r="3" fill="#34D399" filter="url(#glow)"/>

    <rect x="455" y="285" width="80" height="60" rx="8" fill="#1E293B" opacity="0.6"/>
    <rect x="470" y="320" width="10" height="15" rx="2" fill="#38BDF8"/>
    <rect x="490" y="305" width="10" height="30" rx="2" fill="#3B82F6"/>
    <rect x="510" y="295" width="10" height="40" rx="2" fill="#6366F1"/>

    <group transform="translate(425, 365)">
      <rect x="0" y="0" width="50" height="50" rx="25" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      <path d="M 20 25 L 20 21 A 5 5 0 0 1 30 21 L 30 25 Z" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
      <rect x="16" y="25" width="18" height="13" rx="3" fill="#F59E0B"/>
      <circle cx="25" cy="31" r="2" fill="#1E293B"/>
    </group>
  </g>

  <g transform="translate(80, 90)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="170" height="120" rx="16" fill="#FFFFFF"/>
    <rect x="0" y="0" width="170" height="120" rx="16" fill="url(#company-alpha)" opacity="0.04"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 158 0 A 12 12 0 0 1 170 12 L 170 16 L 0 16 Z" fill="url(#company-alpha)"/>
    
    <circle cx="25" cy="40" r="12" fill="url(#company-alpha)"/>
    <path d="M 21 44 L 25 36 L 29 44" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <rect x="45" y="32" width="70" height="8" rx="4" fill="#1E293B"/>
    <rect x="45" y="46" width="45" height="6" rx="3" fill="#94A3B8"/>
    
    <line x1="20" y1="85" x2="150" y2="85" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="40" cy="85" r="4" fill="#3B82F6"/>
    <circle cx="85" cy="85" r="4" fill="#60A5FA"/>
    <circle cx="130" cy="85" r="4" fill="#93C5FD"/>
    <path d="M 20 102 R 10" rx="2" fill="#E2E8F0"/>
    <rect x="20" y="100" width="130" height="6" rx="3" fill="#F1F5F9"/>
    <rect x="20" y="100" width="95" height="6" rx="3" fill="#2563EB"/>
  </g>

  <g transform="translate(90, 370)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="180" height="120" rx="16" fill="#FFFFFF"/>
    <rect x="0" y="0" width="180" height="120" rx="16" fill="url(#company-beta)" opacity="0.04"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 168 0 A 12 12 0 0 1 180 12 L 180 16 L 0 16 Z" fill="url(#company-beta)"/>
    
    <rect x="15" y="30" width="24" height="24" rx="6" fill="url(#company-beta)"/>
    <path d="M 21 45 L 21 35 L 31 35" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M 21 45 L 29 37" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <rect x="48" y="32" width="65" height="8" rx="4" fill="#1E293B"/>
    <rect x="48" y="46" width="50" height="6" rx="3" fill="#94A3B8"/>

    <path d="M 20 100 Q 50 75, 90 90 T 160 70" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 100 Q 50 75, 90 90 T 160 70 L 160 110 L 20 110 Z" fill="url(#company-beta)" opacity="0.06"/>
    <circle cx="160" cy="70" r="4" fill="#059669" filter="url(#glow)"/>
  </g>

  <g transform="translate(540, 220)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="180" height="130" rx="16" fill="#FFFFFF"/>
    <rect x="0" y="0" width="180" height="130" rx="16" fill="url(#company-gamma)" opacity="0.04"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 168 0 A 12 12 0 0 1 180 12 L 180 16 L 0 16 Z" fill="url(#company-gamma)"/>
    
    <circle cx="25" cy="40" r="12" fill="url(#company-gamma)"/>
    <circle cx="25" cy="40" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="18" y1="40" x2="32" y2="40" stroke="#FFFFFF" stroke-width="1"/>

    <rect x="48" y="32" width="80" height="8" rx="4" fill="#1E293B"/>
    <rect x="48" y="46" width="40" height="6" rx="3" fill="#94A3B8"/>

    <g transform="translate(20, 75)">
      <rect x="0" y="15" width="35" height="20" rx="4" fill="#F1F5F9"/>
      <rect x="5" y="23" width="25" height="4" rx="2" fill="#8B5CF6"/>
      
      <rect x="45" y="5" width="35" height="30" rx="4" fill="#F1F5F9"/>
      <rect x="50" y="13" width="25" height="4" rx="2" fill="#7C3AED"/>
      <rect x="50" y="21" width="15" height="4" rx="2" fill="#A78BFA"/>

      <rect x="90" y="0" width="35" height="35" rx="4" fill="#6D28D9"/>
      <rect x="95" y="10" width="25" height="4" rx="2" fill="#FFFFFF" opacity="0.8"/>
      <rect x="95" y="18" width="25" height="4" rx="2" fill="#FFFFFF" opacity="0.5"/>
      <rect x="95" y="26" width="15" height="4" rx="2" fill="#FFFFFF" opacity="0.3"/>
    </g>
  </g>

  <g opacity="0.7">
    <path d="M 680 100 L 692 100 M 686 94 L 686 106" stroke="#94A3B8" stroke-width="2"/>
    <path d="M 120 280 L 130 280 M 125 275 L 125 285" stroke="#94A3B8" stroke-width="2"/>
    
    <circle cx="750" cy="80" r="30" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="750" cy="80" r="45" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    
    <circle cx="340" cy="110" r="3" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="580" cy="160" r="2.5" fill="#A78BFA" filter="url(#glow)"/>
    <circle cx="520" cy="480" r="3.5" fill="#34D399" filter="url(#glow)"/>
    <circle cx="480" cy="100" r="2" fill="#F59E0B" filter="url(#glow)"/>
  </g>
</svg>
